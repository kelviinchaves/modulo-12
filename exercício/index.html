<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
    ">
</head>

<body>
    <div class="row">
        <div class="col d-block text-center mt-5">
            <h2>Cadastre-se</h2>
            <div class=" d-flex justify-content-center">
                <form class="mt-4">
                    <label class="form-label form-md" for="nome">Seu nome</label>
                    <input class="form-control form-md" type="text" id="nome" />
                    <label for="label">Seu e-mail</label>
                    <input id="email" type="email" class="form-control">
                    <label for="tel">Telefone</label>
                    <input id="telefone" type="tel" class="form-control">

                    <button class="btn btn-primary mt-3">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    </div>

</body>

</html>
